<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Capstone Drill</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 32rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    input {
      width: 100%;
      padding: 0.5rem;
      box-sizing: border-box;
    }

    .error-message {
      display: block;
      min-height: 1.25rem;
      color: #b00020;
      font-size: 0.875rem;
      margin: 0.25rem 0 0;
    }

    .error-message[hidden] {
      display: none;
    }

    button {
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
    }
  </style>
</head>
<body>
  <h1>My App</h1>

  <form id="settings-form" novalidate>
    <h2>Settings</h2>

    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name" aria-describedby="name-error">
      <p id="name-error" class="error-message" hidden role="alert" aria-live="polite"></p>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-error">
      <p id="email-error" class="error-message" hidden role="alert" aria-live="polite"></p>
    </div>

    <button type="submit">Save Settings</button>
  </form>

  <script type="module" src="app.js"></script>
</body>
</html>
